# Serve the CA website at the domain root, e.g. https://ca.example.com/
# site-data.js: website.basePath = "/"   then run: node scripts/generate-seo.mjs

server {
    listen 443 ssl http2;
    server_name ca.example.com;

    # ssl_certificate     /etc/letsencrypt/live/ca.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ca.example.com/privkey.pem;

    root /var/www/ca-website;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;

    location ~* \.(html|js)$ {
        add_header Cache-Control "no-cache";
    }
    location ~* \.(css|svg|png|jpe?g|webp|woff2)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    # Keep repo-only files private.
    location ~ ^/(scripts|tests|deploy|node_modules)/ { return 404; }
    location ~ ^/(package\.json|README\.md|CONTENT-REVIEW\.md)$ { return 404; }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

server {
    listen 80;
    server_name ca.example.com;
    return 301 https://$host$request_uri;
}
