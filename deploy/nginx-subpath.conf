# Serve the CA website at https://example.com/ca/
#
# Layout on the server (the website folder is named "ca" inside your web root):
#   /var/www/example.com/            ← your existing personal site (root)
#   /var/www/example.com/ca/         ← contents of this project (index.html etc.)
#
# site-data.js: website.basePath = "/ca/"  and  website.siteUrl = "https://example.com"
#
# Add these location blocks INSIDE your existing `server { ... }` for example.com,
# whose `root` is /var/www/example.com.

    # /ca  →  /ca/  (relative asset paths need the trailing slash)
    location = /ca {
        return 301 /ca/;
    }

    location /ca/ {
        try_files $uri $uri/ =404;
        error_page 404 /ca/404.html;
        # HTML and src/data/site-data.js change whenever content is edited.
        add_header Cache-Control "no-cache";
    }

    # Long cache for fonts, images and stylesheets.
    location ~* ^/ca/.+\.(css|svg|png|jpe?g|webp|woff2)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Repo-only files are not part of the public site.
    location ~ ^/ca/(scripts|tests|deploy|node_modules)/ { return 404; }
    location ~ ^/ca/(package\.json|README\.md|CONTENT-REVIEW\.md|\.gitignore)$ { return 404; }

# Make sure your nginx `mime.types` maps .js to JavaScript (default installs do);
# ES modules will not run if served as text/plain.
#
# Recommended security headers for the server block:
#   add_header X-Content-Type-Options "nosniff" always;
#   add_header Referrer-Policy "strict-origin-when-cross-origin" always;
#   add_header X-Frame-Options "SAMEORIGIN" always;
# Optional Content-Security-Policy (adjust form/map domains to what you use):
#   add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self' https://formspree.io; frame-src https://www.google.com; base-uri 'self'; object-src 'none'" always;
#
# robots.txt: crawlers only read https://example.com/robots.txt (domain root).
# Add this line to that file:
#   Sitemap: https://example.com/ca/sitemap.xml
